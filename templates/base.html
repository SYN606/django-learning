{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zoro Blog{% endblock %}</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#a4b9ff",
                        accent: "#ffc2e2",
                        darkbg: "#0d0d0d",
                    }
                }
            }
        }
    </script>

    {% block css %}{% endblock %}
</head>

<body class="bg-[#0d0d0d] text-gray-100 font-sans antialiased">

    {% include "navbar.html" %}

    <!-- Flash Messages -->
    {% if messages %}
    <div class="fixed top-6 right-6 space-y-3 z-50 w-[300px]">
        {% for message in messages %}
        <div class="px-4 py-3 rounded-xl backdrop-blur-md bg-white/5 border text-sm shadow-lg
            {% if message.tags == 'success' %}
                border-green-400/40 text-green-300
            {% elif message.tags == 'error' %}
                border-red-400/40 text-red-300
            {% elif message.tags == 'warning' %}
                border-yellow-400/40 text-yellow-300
            {% else %}
                border-primary/40 text-accent
            {% endif %}
        ">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block layout %}
    <main class="min-h-[80vh] max-w-6xl mx-auto px-6 py-16">
        {% block body_content %}{% endblock %}
    </main>
    {% endblock %}

</body>

</html>
