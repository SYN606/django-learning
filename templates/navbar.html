<div class="bg-[#0d0d0d] text-white shadow-md border-b border-[#2a2a2a]">
  <nav class="container mx-auto flex items-center justify-between px-6 py-4">
    <!-- Logo -->
    <div class="flex items-center space-x-2">
      <span class="text-[#a4b9ff] text-2xl font-bold tracking-wide">SYN<span class="text-[#ffc2e2]">606</span></span>
    </div>

    <!-- Mobile Menu Button -->
    <button id="menu-btn" class="block md:hidden focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="#eaeaea" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <!-- Nav Links -->
    <div id="menu" class="hidden md:flex md:items-center space-y-4 md:space-y-0 md:space-x-8 absolute md:static top-[64px] left-0 w-full md:w-auto bg-[#0d0d0d] md:bg-transparent md:p-0 p-4 transition-all duration-300 ease-in-out">
      <a href="{% url 'homepage' %}" class="text-[#dcdcdc] hover:text-[#a4b9ff] font-medium transition">Home</a>

      <a href="{% url 'blogs:blog_page' %}" class="text-[#dcdcdc] hover:text-[#a4b9ff] font-medium transition">Blogs</a>

      <a href="{% url 'about' %}" class="text-[#dcdcdc] hover:text-[#a4b9ff] font-medium transition">About</a>

      {% if user.is_authenticated %}
        <a href="{% url 'logout' %}" class="bg-[#f6b6b6] hover:bg-[#f3a8a8] text-[#222] font-semibold px-4 py-2 rounded-xl transition">Logout</a>
      {% else %}
        <a href="{% url 'login' %}" class="bg-[#b6e3b0] hover:bg-[#a9d8a2] text-[#000] font-semibold px-4 py-2 rounded-xl transition">Login</a>
      {% endif %}
    </div>
  </nav>
</div>

<script>
  const menuBtn = document.getElementById('menu-btn')
  const menu = document.getElementById('menu')
  
  menuBtn.addEventListener('click', () => {
    menu.classList.toggle('hidden')
  })
</script>
