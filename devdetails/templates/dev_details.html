{% extends 'base.html' %}
{% load static %}

{% block css %}
  <link rel="stylesheet" href="{% static 'css/dev_details.css' %}" />
{% endblock %}

{% block content %}
  <h3 class="mb-4">Student Records</h3>

  <table class="custom-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Role</th>
      </tr>
    </thead>

    <tbody>
      {% for student in student_data %}
        <tr>
          <td>{{ student.id_number }}</td>
          <td>
            <a href="{% url 'device_details:std_details' student.id %}">{{ student.name }}</a>
          </td>
          <td>{{ student.role }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
